<<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario Participa</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main>
    <section class="contenedor">

      <h1>Formulario de Participación</h1>

      <p>
        Este formulario permite recoger ideas, propuestas y opiniones de la comunidad.
        La información será usada únicamente con fines de participación responsable.
      </p>

      <form>

        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="william-mendez" required>

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" placeholder="williammendeztocora@gmail.com
        <label for="mensaje">Mensaje o propuesta</label>
        <textarea id="mensaje" name="mensaje" placeholder=Mi propuesta para la comunidad es
     fomentar más espacios de participación donde las personas
          puedan expresar sus ideas y necesidades de manera sencilla y
           segura. También considero importante mejorar la comunicación
            entre la comunidad y las instituciones, para que la 
            información llegue de forma clara y oportuna. Además,
           sería bueno promoveractividades educativas y tecnológicas 
           que ayuden a los jóvenes a involucrarse más en el desarrollo de su entorno
         y a usar la tecnología de forma responsable."" required></textarea>

        <label for="tema">Tema de interés</label>
        <select id="tema" name="tema">
          <option>Educación</option>
          <option>Tecnología</option>
          <option>Comunidad</option>
          <option>Medio ambiente</option>
        </select>

        <label>
          <input type="checkbox" required>
          Acepto el uso responsable de mi información
        </label>

        <button type="submit">Enviar participación</button>

      </form>

    </section>
  </main>

</body>
</html>
